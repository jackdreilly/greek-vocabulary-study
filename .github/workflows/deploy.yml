name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Use corepack so the pnpm version is taken from package.json's
      # "packageManager" field. Do NOT add pnpm/action-setup as well — having
      # both makes pnpm error with ERR_PNPM_BAD_PM_VERSION (multiple versions).
      - name: Enable corepack
        run: corepack enable

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter ./web build

      - name: Build functions
        run: pnpm --filter ./functions build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FANARI_DEPLOY_SA }}

      - name: Deploy Firebase
        run: |
          pnpm exec firebase deploy \
            --only hosting,functions,firestore:rules,firestore:indexes,storage \
            --project fanari-b6bb4 \
            --non-interactive \
            --force
